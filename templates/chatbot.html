<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>AI Recruitment Chatbot</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='chatbot.css') }}">

</head>

<body>

<div class="chat-container">

    <!-- HEADER -->

    <div class="chat-header">

        <div class="d-flex align-items-center">

            <div class="bot-icon">
                <i class="fas fa-robot"></i>
            </div>

            <div class="ms-3">

                <h5 class="mb-0">
                    AI Recruitment Assistant
                </h5>

                <small>
                    Online | Candidate Screening Support
                </small>

            </div>

        </div>

        <a href="/"
           class="btn btn-light btn-sm">
            <i class="fas fa-home"></i> Home
        </a>

    </div>


    <!-- CHAT MESSAGES -->

    <div class="chat-body" id="chatBody">

        <div class="message bot-message">

            <div class="avatar">
                <i class="fas fa-robot"></i>
            </div>

            <div class="message-content">

                Hello! I am your AI Recruitment Assistant.

                <br><br>

                I can help you find candidates, analyze skills,
                compare matching scores and understand
                screening results.

                <br><br>

                Type <b>help</b> to see what I can do.

            </div>

        </div>

    </div>


    <!-- SUGGESTED QUESTIONS -->

    <div class="suggestions">

        <button onclick="sendSuggestion('Who is the best candidate?')">
            Best candidate
        </button>

        <button onclick="sendSuggestion('Show top three candidates')">
            Top candidates
        </button>

        <button onclick="sendSuggestion('Find candidates with Python skills')">
            Python candidates
        </button>

        <button onclick="sendSuggestion('How many candidates were screened?')">
            Total candidates
        </button>

    </div>


    <!-- INPUT AREA -->

    <div class="chat-footer">

        <input
            type="text"
            id="userInput"
            placeholder="Ask about candidates, skills or scores..."
            autocomplete="off">

        <button id="sendButton"
                onclick="sendMessage()">

            <i class="fas fa-paper-plane"></i>

        </button>

    </div>

</div>


<script src="{{ url_for('static', filename='chatbot.js') }}"></script>

</body>

</html>
